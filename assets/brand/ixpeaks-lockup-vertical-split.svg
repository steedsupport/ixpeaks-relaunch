  <!-- Standard gap: 0.20 × visible emblem height, measured to the wordmark cap height. -->
  <text x="302" y="490" text-anchor="middle" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif" font-size="86" font-weight="800" letter-spacing="5"><tspan fill="#FFFFFF">IX</tspan><tspan fill="#FF5A1F">PEAKS</tspan></text>
